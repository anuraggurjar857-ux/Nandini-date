<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>A Little Question for Nandini 💗</title>
  <style>
    :root { --pink:#ff5f87; --deep:#e84370; --soft:#fff0f5; --ink:#46343c; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; overflow:hidden; color:var(--ink);
      font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
      background: radial-gradient(circle at top left,#ffe0ec 0,transparent 38%),
                  radial-gradient(circle at bottom right,#ffd9e7 0,transparent 38%),
                  linear-gradient(135deg,#fff8fb,#fff0f5);
      display:grid; place-items:center; padding:20px;
    }
    .card {
      width:min(100%,560px); min-height:530px; padding:34px 24px 28px;
      position:relative; text-align:center; border:2px solid #ffffffcc;
      border-radius:30px; background:#ffffffa8;
      box-shadow:0 20px 70px #df6b9220, inset 0 0 0 1px #ffc9da;
      backdrop-filter: blur(8px); overflow:hidden;
    }
    .tiny-heart { font-size:32px; animation: heartbeat 1.4s infinite; }
    h1 { color:var(--deep); font-size:clamp(2rem,7vw,3rem); margin:12px 0 8px; }
    .question { font-size:clamp(1.15rem,4vw,1.55rem); font-weight:800; line-height:1.4; margin:0 auto 12px; }
    .sub { max-width:350px; margin:0 auto; line-height:1.7; color:#806a74; }
    .buttons { display:flex; align-items:center; justify-content:center; gap:18px; margin-top:30px; min-height:64px; }
    button { border:0; color:white; font:700 1rem inherit; font-size:1rem; padding:14px 28px; border-radius:999px; cursor:pointer; box-shadow:0 7px 18px #b64c6b22; transition:transform .2s, filter .2s; touch-action:manipulation; }
    button:active { transform:scale(.96); }
    #yesBtn { background:linear-gradient(135deg,#ff7398,#e84370); z-index:2; }
    #noBtn { background:#8d7a85; position:relative; z-index:5; }
    .cat { font-size:76px; margin-top:26px; filter:drop-shadow(0 6px 4px #d85c7920); }
    .hint { font-size:.82rem; color:#b68b9b; margin-top:9px; }
    .screen { display:none; }
    .screen.active { display:block; animation:appear .6s ease both; }
    .success-title { font-size:clamp(1.8rem,7vw,2.5rem); color:var(--deep); margin:16px 0; }
    .success-message { font-size:1.1rem; line-height:1.6; }
    #againBtn { margin-top:18px; background:linear-gradient(135deg,#ff7398,#e84370); }
    .floaty { position:fixed; bottom:-40px; pointer-events:none; z-index:10; animation:floatUp linear forwards; }
    .sparkle { position:fixed; pointer-events:none; z-index:20; animation:pop 900ms ease-out forwards; }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.15)} 30%{transform:scale(1)} }
    @keyframes appear { from{opacity:0;transform:translateY(12px) scale(.98)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes floatUp { to { transform:translateY(-115vh) rotate(25deg); opacity:0; } }
    @keyframes pop { from{transform:translate(0,0) scale(.4);opacity:1} to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0} }
    @media(max-width:420px) {
      body{padding:12px}
      .card{padding:28px 16px 20px; min-height:510px; border-radius:24px}
      .buttons{gap:12px; margin-top:25px}
      button{padding:13px 23px}
      .cat{margin-top:22px}
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <section id="askScreen" class="screen active">
      <div class="tiny-heart" aria-hidden="true">♡</div>
      <h1>Nandini...</h1>
      <p class="question">Will you go on a date with me? 💗</p>
      <p class="sub">I have a little question for you, and I’m hoping for a cute answer... 🥹</p>
      <div class="buttons" id="buttonArea">
        <button id="yesBtn" type="button">Yes! ❤️</button>
        <button id="noBtn" type="button">No 🙈</button>
      </div>
      <div class="cat" aria-hidden="true">🐱💗</div>
      <p class="hint">Choose carefully… the little button might be shy 👀</p>
    </section>

    <section id="yesScreen" class="screen">
      <div class="tiny-heart" aria-hidden="true">💖</div>
      <h2 class="success-title">You just made my day! 🥹❤️</h2>
      <p class="success-message">It's a date, Nandini! 🌷<br>Now you owe me one cute smile. 😊</p>
      <div class="cat" aria-hidden="true">🐱💕</div>
      <button id="againBtn" type="button">Replay the magic ✨</button>
    </section>
  </main>

  <script>
    const askScreen = document.getElementById('askScreen');
    const yesScreen = document.getElementById('yesScreen');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const buttonArea = document.getElementById('buttonArea');
    const againBtn = document.getElementById('againBtn');

    // Make the No button move away when someone approaches it.
    function moveNoButton() {
      const margin = 12;
      const maxX = Math.max(margin, window.innerWidth - noBtn.offsetWidth - margin);
      const maxY = Math.max(margin, window.innerHeight - noBtn.offsetHeight - margin);
      noBtn.style.position = 'fixed';
      noBtn.style.left = (margin + Math.random() * (maxX - margin)) + 'px';
      noBtn.style.top = (margin + Math.random() * (maxY - margin)) + 'px';
      noBtn.style.transform = `rotate(${Math.random() * 18 - 9}deg)`;
    }
    noBtn.addEventListener('pointerenter', moveNoButton);
    noBtn.addEventListener('touchstart', (event) => {
      event.preventDefault();
      moveNoButton();
    }, {passive:false});
    noBtn.addEventListener('click', (event) => {
      event.preventDefault();
      moveNoButton();
    });

    function makeFloatingHearts(count=22) {
      const emojis = ['💗','💕','💖','💘','🌸','✨','❤️'];
      for (let i=0; i<count; i++) {
        const heart = document.createElement('span');
        heart.className = 'floaty';
        heart.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        heart.style.left = Math.random()*100 + 'vw';
        heart.style.fontSize = (16 + Math.random()*22) + 'px';
        heart.style.animationDuration = (3 + Math.random()*3) + 's';
        heart.style.animationDelay = (Math.random()*.7) + 's';
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }
    }
    function confettiBurst() {
      const symbols = ['💖','✨','💕','🌸','❤️','🎉'];
      for (let i=0; i<42; i++) {
        const bit = document.createElement('span');
        bit.className = 'sparkle';
        bit.textContent = symbols[Math.floor(Math.random()*symbols.length)];
        bit.style.left = (window.innerWidth/2) + 'px';
        bit.style.top = (window.innerHeight/2) + 'px';
        bit.style.setProperty('--dx', (Math.random()*440-220) + 'px');
        bit.style.setProperty('--dy', (Math.random()*440-220) + 'px');
        bit.style.fontSize = (14 + Math.random()*18) + 'px';
        document.body.appendChild(bit);
        setTimeout(() => bit.remove(), 1000);
      }
    }
    yesBtn.addEventListener('click', () => {
      askScreen.classList.remove('active');
      yesScreen.classList.add('active');
      noBtn.style.display = 'none';
      makeFloatingHearts(34);
      confettiBurst();
    });
    againBtn.addEventListener('click', () => {
      yesScreen.classList.remove('active');
      askScreen.classList.add('active');
      noBtn.style.display = '';
      noBtn.style.position = 'relative';
      noBtn.style.left = '';
      noBtn.style.top = '';
      noBtn.style.transform = '';
    });
  </script>
</body>
</html>
